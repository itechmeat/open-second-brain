name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (with or without leading v). Defaults to package.json version."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean

# Read-only by default: the verify job runs the tree's own code and never
# needs to write. Only the job that publishes the release gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}-${{ github.event.inputs.version || '' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release tags a commit that already went through CI on main. When
      # `validate` and `windows` both passed on this exact commit, running
      # the same suites again proves nothing new; the cheap packaging checks
      # below still run either way. No green CI on the commit (a tag pushed
      # early, a manual dispatch elsewhere) means the suites run here.
      - name: CI already passed on this commit?
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          passed=true
          for check in validate windows; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check" \
              -q '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion // ""' \
              || true)
            echo "$check on $GITHUB_SHA: ${conclusion:-none}"
            [ "$conclusion" = "success" ] || passed=false
          done
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Set up Python (Hermes plugin tests)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Verify manifest version sync
        run: bun run sync-version:check

      - name: Broken-link ratchet
        run: bun run link-ratchet:check

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run TypeScript test suite (bun:test)
        if: steps.ci.outputs.passed != 'true'
        run: bun test --parallel

      - name: Run Python plugin tests
        if: steps.ci.outputs.passed != 'true'
        run: python -m unittest discover -s tests/python -v

      - name: Validate manifests and CLI scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool openclaw.plugin.json >/dev/null
          python -m json.tool package.json >/dev/null
          python -m compileall -q plugins/hermes
          bash -n scripts/o2b
          bash -n scripts/vault-log
          bash -n scripts/_bun-precheck.sh
          ./scripts/o2b doctor --vault . --repo .

      - name: Validate OpenClaw bundle is in sync with sources
        shell: bash
        run: |
          set -euo pipefail
          # Re-build into a temp file and diff against the committed bundle
          # so a stale `openclaw/index.js` fails CI rather than ships silently.
          bun build src/openclaw/index.ts \
            --outfile /tmp/openclaw-rebuild.js \
            --target=node --format=esm \
            --external openclaw/plugin-sdk/plugin-entry
          diff -q /tmp/openclaw-rebuild.js openclaw/index.js \
            || { echo "openclaw/index.js is out of date; run: bun run build:openclaw" >&2; exit 1; }

      - name: Validate OpenClaw packaging
        shell: bash
        run: |
          set -euo pipefail
          node -e "const pkg = require('./package.json'); if (!pkg.openclaw?.extensions?.length) throw new Error('missing openclaw.extensions')"
          for entry in $(node -e "console.log(require('./package.json').openclaw.extensions.join(' '))"); do
            [ -f "$entry" ] || { echo "Missing entry: $entry"; exit 1; }
          done

  release:
    name: Build and publish GitHub release
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    # Only fire on actual release events — every push triggers `verify`,
    # but only tag pushes / workflow_dispatch should publish.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      VERSION_INPUT: ${{ github.event.inputs.version || '' }}
      PRERELEASE_INPUT: ${{ github.event.inputs.prerelease || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          elif [ -n "${VERSION_INPUT}" ]; then
            version="${VERSION_INPUT#v}"
            tag="v${version}"
          else
            version="${pkg_version}"
            tag="v${version}"
          fi

          if [ "${version}" != "${pkg_version}" ]; then
            echo "Release version ${version} does not match package.json version ${pkg_version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [ "${PRERELEASE_INPUT}" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi

          # The normal flow publishes a curated release (notes, image assets)
          # via `gh release create` BEFORE this workflow runs — creating the
          # tag is what triggers it. An existing release is therefore the
          # expected end state, not an error: verify stays the safety net and
          # this step only creates a release when none exists yet (e.g. a
          # bare `git push --tags` or a workflow_dispatch run).
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — keeping the curated release as-is."
            echo "::notice title=Release exists::${TAG} was already published; skipped auto-creation."
            exit 0
          fi

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "open-second-brain ${TAG}" \
            --generate-notes \
            "${prerelease_args[@]}"

  publish:
    name: Publish registry package
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: registry-publish-open-second-brain
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      action: ${{ steps.plan.outputs.action }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    env:
      NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
      NPM_VERSION: 11.14.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Check Node version
        run: node -e 'const [a,b,c] = process.versions.node.split(".").map(Number); if (a < 22 || (a === 22 && (b < 14 || (b === 14 && c < 0)))) throw new Error(`Node ${process.versions.node} is below 22.14.0`); console.log(process.versions.node)'

      - name: Install pinned registry client
        run: |
          npm_prefix="$RUNNER_TEMP/npm-global"
          npm install --global --prefix "$npm_prefix" "npm@$NPM_VERSION"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
          "$npm_prefix/bin/npm" --version

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Compare release tag to package version
        run: bun run scripts/publish-plan.ts --compare-only

      - name: Pack checked tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tarball="$RUNNER_TEMP/open-second-brain-$version.tgz"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" >/dev/null
          bun run scripts/pack-manifest.ts --tarball "$tarball"
          echo "path=$tarball" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: plan
        run: bun run scripts/publish-plan.ts

      - name: Upload checked tarball
        if: always() && steps.pack.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-second-brain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish checked tarball
        if: steps.plan.outputs.action == 'publish'
        env:
          TARBALL: ${{ steps.pack.outputs.path }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: npm publish "$TARBALL" --tag "$TAG" --access public --ignore-scripts

      - name: Report skipped publish
        if: steps.plan.outputs.action != 'publish'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

  publish-smoke:
    name: Smoke test registry install
    needs: publish
    if: needs.publish.outputs.action == 'publish'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install and run published version
        run: bun run scripts/registry-smoke.ts "open-second-brain@${{ needs.publish.outputs.version }}" "${{ needs.publish.outputs.version }}"
