schema: 2
id: osb-feature-release
name: OSB feature release wave
description: 'Run one full release wave for Open Second Brain: scan the kanban triage column, propose argued scope options to the operator, then drive the feature-release-playbook through every phase in order - reconnaissance and design, TDD implementation, self-review against main, QA, docs and version bump, PR with a verified mermaid, operator-gated merge, a release with an interaction-diagram image, and the tracker tick that moves the shipped cards to done. The operator brief rides as a default parameter any run may override.'
version: 1.1.0
params:
- name: brief
  type: text
  label: Standing engineering brief (override to change the rules of the cycle)
  options: null
  default: 'Work as a senior backend developer: SOLID, KISS, DRY, repeated values hoisted into named constants. Forbidden: fallbacks that silently do nothing and mislead (errors surface explicitly, by name), stubs, hardcoded values that belong in constants, and hardcoded natural-language phrases in any language - everything is English and other-language cases are handled abstractly. Follow the feature-release-playbook skill through ALL its phases in order; merging or skipping phases is forbidden. In the self-review phase check every change against main even if it is already committed, using the superpowers review skills. Bump the project version before pushing, inside the feature PR, per CLAUDE.md (edit package.json only, then run scripts/sync-version.ts). After opening the PR verify that any mermaid diagram renders correctly. Never move the selected triage cards until the finale (moving them early triggers the hermes agents); after the release move them to done with handoff summaries. Reply to the operator in the operator''s chat language; write every artifact in English. A node attempt is one uninterrupted job: never end your reply while a command you started is still running - wait for it and finish the whole task; a partial progress report is not a node result.'
- name: cycle_focus
  type: text
  label: What this cycle should optimize for (override per run)
  options: null
  default: Pick one or several RELATED triage cards by priority, reading the validator comments on each. Propose two or three options and argue them properly; usefulness to the project is the supreme criterion. A pull request around 50-70 changed files with at most 10 features is the target shape, and hitting that target is the weakest signal of all - never trade usefulness for it.
- name: board_access
  type: text
  label: How this machine reaches the board the kanban script talks to (operator setup, shown to the agent)
  default: 'The script reaches the board endpoint configured in it. A connection error means that endpoint is unreachable from this machine, not that the board is empty.'
defaults:
  profile:
    name: osb-developer
    scope: auto
  max_retries: null
  timeout_seconds: null
supervisor: null
trigger:
  when:
  - start a new open-second-brain release cycle from the kanban board
  - implement a batch of related triage tasks end to end and release them
  - run the feature-release-playbook as a full wave with an operator scope gate
  avoid_when:
  - validating or triaging cards without implementing (use osb-triage-validator)
  - a single trivial fix that does not warrant a release wave
  examples:
  - начинаем новый цикл
  - take a big scope of related low-priority tasks and ship a release
requires:
  files:
  - .ai-notes/kanban.ts
  - CLAUDE.md
  commands:
  - bun
  - git
  - gh
goal:
  statement: A scope the operator chose is implemented, merged into main, released on GitHub with an interaction-diagram image, and every shipped card on the kanban board reads done with a handoff summary.
  criteria:
  - description: Every phase of the feature-release-playbook ran in order, none merged and none skipped, with the self-review comparing the full branch against main.
    check:
      type: manual
  - description: The version was bumped inside the feature PR, the release is published with a rendered interaction diagram, and the shipped cards are in done while refused or reshaped cards carry their verdicts.
    check:
      type: manual
effects:
- fs_read
- fs_write
- network
- external
- irreversible
nodes:
- id: start
  title: Start
  expected_duration: null
  inputs: null
  outputs: null
  cache: null
  type: start
- id: scope_scan
  title: Scan the board and build scope options
  expected_duration: 20m
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    Cycle focus: {{params.cycle_focus}}

    Run `bun .ai-notes/kanban.ts triage --json` from the project root
    (operator-local, credential-bearing script: run it, never copy it
    or any token). Board access: {{params.board_access}}
    If the board is unreachable, fail this node with
    that reason instead of proposing options from memory. Read every
    card WITH its comments - validator
    comments carry verdicts and corrected scopes. Build TWO or THREE
    candidate scope options. For each option: the card ids and
    titles, the unifying spine that makes them one coherent PR, the
    argued usefulness to the project right now, a rough size
    estimate, and the main risk. Recommend one option and say why.

    Wrap ONLY the final proposal in <node_output> and </node_output>
    tags: first a compact human-readable summary of the options
    (this is what the operator will read at the review gate), then a
    line `JSON:` followed by the options as compact JSON
    [{option, cards: [ids], spine, why, size, risk}].
  profile: null
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: choose_scope
  title: Operator picks the scope
  expected_duration: null
  inputs: null
  outputs: null
  cache: null
  type: human_review
  options:
  - option-1
  - option-2
  - option-3
  - revise
  prompt: Read the scope options in the scope_scan output. Pick option-1, option-2, or option-3 to start the wave on that scope, or "revise" with a note describing what to change - the scan will run again with your note.
- id: design
  title: 'Phases 0-1: reconnaissance, brainstorm, design'
  expected_duration: 60m
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    The run context below carries the scope options and the
    operator's review decision (which option was picked, plus any
    note). Honor the picked option exactly.
    {{run.context}}

    Invoke the feature-release-playbook skill and run its phases 0
    and 1 for the chosen option, with one strengthening this project
    has proven necessary: BEFORE the consultant brainstorm, verify
    every selected card's premise against the live source (open the
    anchors, grep for mechanisms the card claims are missing, check
    the kernel invariants). Past waves found a third to two thirds
    of premises corrected or refuted by this reading. A refuted card
    gets its verdict recorded in the design doc rather than being
    built.

    Deliverables committed on a new feat/<slug> branch: the
    docs/brainstorm/<slug>/ set (design.md, plan.md, variants.md,
    cli-output/) per the playbook's own templates, with the plan
    broken into TDD-ready tasks.

    Wrap ONLY a completion summary in <node_output> and
    </node_output> tags: branch name, slug, task list from plan.md,
    any premise corrections or refusals, commit sha.
  profile: null
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: implement
  title: 'Phase 2: TDD implementation'
  expected_duration: 4h
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    Design summary: {{nodes.design.output}}

    Run phase 2 of the feature-release-playbook on the branch the
    design phase created: implement plan.md task by task, strict
    TDD - failing test first, run it and see the expected failure,
    implement to green, refactor green, one conventional commit per
    atomic unit, formatted and linted before every commit. Test runs
    use a throwaway HOME (`env HOME=$(mktemp -d) bun test <paths>`).
    Improve defects you find in code you touch and name them in the
    commit bodies. Stage files by name, never `git add -A` or
    `git add .`: the repository root carries untracked runtime
    directories (for example .apb/) that are not part of any feature.

    Wrap ONLY a completion summary in <node_output> and
    </node_output> tags: commits (sha + title), per-task status,
    failing-first evidence snippets, suites run with counts.
  profile: null
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: self_review
  title: 'Phase 3: self-review against main'
  expected_duration: 90m
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    Implementation summary: {{nodes.implement.output}}

    Run phase 3 of the feature-release-playbook: the full
    self-review of EVERYTHING on the branch relative to main -
    committed work included. Use the superpowers review skills
    (requesting-code-review, verification-before-completion): static
    security scan of the diff, an independent fresh-context review
    of the complete branch diff, and evidence-backed verification of
    every claim. Apply the findings in dedicated fix commits; a
    finding you reject is named with its reason. Stage files by
    name, never `git add -A` or `git add .`.

    Wrap ONLY a completion summary in <node_output> and
    </node_output> tags: findings by severity, dispositions, fix
    commits, remaining known issues (should be none or argued).
  profile: null
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: qa
  title: 'Phase 4: QA gates'
  expected_duration: 45m
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    Self-review summary: {{nodes.self_review.output}}

    Run phase 4 of the feature-release-playbook: the full test suite
    on a clean HOME, typecheck, lint, sync/schema checks the project
    ships, and a real smoke of the new behavior through the actual
    CLI or MCP surface. Fix in-branch until every gate is green; do
    not proceed with a red gate.

    Wrap ONLY the results in <node_output> and </node_output> tags:
    each gate with its actual counts/output tail, smoke evidence.
  profile: null
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: docs_version
  title: 'Phase 5: docs and version bump'
  expected_duration: 40m
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    QA results: {{nodes.qa.output}}

    Run phase 5 of the feature-release-playbook: CHANGELOG.md entry
    in the house voice under the next version heading plus its
    compare link-reference, README "What is new" refresh, every doc
    the design named as affected, and the version bump per CLAUDE.md
    (package.json only, then scripts/sync-version.ts, verify with
    --check) - the bump rides in this PR, before any push. Commit.

    Wrap ONLY a summary in <node_output> and </node_output> tags:
    new version, changelog heading, docs touched, commit sha,
    sync-check result.
  profile: null
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: pr
  title: 'Phases 6-7: PR, mermaid, review handling'
  expected_duration: 60m
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    Docs summary: {{nodes.docs_version.output}}

    Run phases 6 and 7 of the feature-release-playbook: push the
    branch, open the PR with the playbook's body shape (capability
    summary, a mermaid diagram of the process-level benefit,
    concrete benefits, what ships, test plan). VERIFY the mermaid
    parses/renders before relying on it (headless mermaid.parse or
    equivalent) and verify it survived into the PR body. Arm
    auto-merge (squash). Wait briefly for the configured AI reviewer
    and apply its findings per the playbook; if it skips (file-count
    or credit limits), document the compensating internal review in
    a PR comment. Watch CI on the PR and fix a red gate in-branch.

    This node is one uninterrupted job. If you start a long command
    (the full test suite, CI), wait for it to finish with ONE long
    blocking call at a time, not short polls: every tool call re-sends
    your whole context. For CI use `timeout 540 gh pr checks <number>
    --watch --fail-fast` (repeat while checks are pending); for a local
    suite run it in the background into a log and block on its pid
    (`timeout 540 bash -c 'while kill -0 <pid>; do sleep 20; done'`).
    Only then continue. Never end your reply
    with a progress report; the run treats your reply as the node's
    final result and moves on. Before you finish, confirm with
    `gh pr view <number> --json state,url` that the PR exists and
    is open, and with `git rev-parse origin/<branch>` that the push
    landed.

    Wrap ONLY a summary in <node_output> and </node_output> tags,
    and only after the PR exists. Required first line inside the
    tags: `PR: #<number> <url>` (the run rejects a result without
    it). Then: mermaid verification evidence, CI status, reviewer
    outcome. If the PR could not be opened, the first line is
    `PR: none - <reason>` and the run stops here.
  profile: null
  success_check:
    marker: 'PR: #'
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: merge_gate
  title: Operator merge gate
  expected_duration: null
  inputs: null
  outputs: null
  cache: null
  type: human_review
  options:
  - merged
  - abandon
  prompt: Approve the PR on GitHub (auto-merge is armed; approval triggers the squash). When you see it merged, pick "merged". Pick "abandon" only to stop the wave without releasing.
- id: release
  title: 'Phases 8-9: release with an interaction diagram'
  expected_duration: 60m
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    PR summary: {{nodes.pr.output}}
    Operator note at the merge gate: {{nodes.merge_gate.review_note}}

    Confirm the PR is merged (gh pr view --json state) and main CI
    is green, sync local main, then run the release phase. The
    release image follows the INTERACTION-DIAGRAM style of release
    v1.10.0 (https://github.com/itechmeat/open-second-brain/releases/tag/v1.10.0):
    a scheme of interacting parts that shows the usefulness of THIS
    release - actors, flows, and arrows - not text blocks and not
    deep technical detail. Render it, then LOOK at the rendered
    image and verify the layout and especially the arrows are
    correct and anchored to their blocks (clean orthogonal or
    straight connectors, never skewed bezier curves from empty
    space); iterate until it reads well. Publish the GitHub release
    in the house voice with the image, upload source assets.

    This node is one uninterrupted job: never end your reply while
    a command you started is still running, and never end with a
    progress report. Wrap ONLY a summary in <node_output> and
    </node_output> tags, first line `RELEASE: <url>` confirmed by
    `gh release view`, then asset names and the image verification
    note.
  profile: null
  success_check:
    marker: 'RELEASE: https://'
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: tracker
  title: 'Phase 10: tracker tick'
  expected_duration: 20m
  inputs: null
  outputs:
    files: []
    extract: node_output
  cache: null
  type: agent_task
  prompt: |
    Standing brief: {{params.brief}}
    Release summary: {{nodes.release.output}}
    Design summary (for refusals): {{nodes.design.output}}

    Run phase 10: move every shipped card to done via
    `bun .ai-notes/kanban.ts done <id> "<handoff summary pointing at
    the release URL>"`. Cards whose premise was refused or reshaped
    get a verdict comment and an appropriate parked priority instead
    of a dishonest done. Nothing in the scope is left open without
    either a done or a recorded verdict. Re-read the board after
    writing and report the actual status of every card in scope.

    Wrap ONLY the final wave summary in <node_output> and
    </node_output> tags: per-card disposition as read back from the
    board, release URL, version.
  profile: null
  max_retries: null
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
- id: done
  title: null
  expected_duration: null
  inputs: null
  outputs: null
  cache: null
  type: finish
  outcome: success
  prompt: null
  profile: null
- id: abandoned
  title: null
  expected_duration: null
  inputs: null
  outputs: null
  cache: null
  type: finish
  outcome: failure
  prompt: null
  profile: null
edges:
- from: start
  to: scope_scan
  condition: null
  fallback: false
  join: null
- from: scope_scan
  to: choose_scope
  condition: null
  fallback: false
  join: null
- from: choose_scope
  to: design
  condition:
    type: review_status
    equals: option-1
  fallback: false
  join: null
- from: choose_scope
  to: design
  condition:
    type: review_status
    equals: option-2
  fallback: false
  join: null
- from: choose_scope
  to: design
  condition:
    type: review_status
    equals: option-3
  fallback: false
  join: null
- from: choose_scope
  to: scope_scan
  condition:
    type: review_status
    equals: revise
  fallback: false
  join: null
  max_traversals: 3
- from: design
  to: implement
  condition: null
  fallback: false
  join: null
- from: implement
  to: self_review
  condition: null
  fallback: false
  join: null
- from: self_review
  to: qa
  condition: null
  fallback: false
  join: null
- from: qa
  to: docs_version
  condition: null
  fallback: false
  join: null
- from: docs_version
  to: pr
  condition: null
  fallback: false
  join: null
- from: pr
  to: merge_gate
  condition: null
  fallback: false
  join: null
- from: merge_gate
  to: release
  condition:
    type: review_status
    equals: merged
  fallback: false
  join: null
- from: merge_gate
  to: abandoned
  condition:
    type: review_status
    equals: abandon
  fallback: false
  join: null
- from: release
  to: tracker
  condition: null
  fallback: false
  join: null
- from: tracker
  to: done
  condition: null
  fallback: false
  join: null
