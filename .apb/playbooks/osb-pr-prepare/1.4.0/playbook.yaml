- id: bot_review
  title: Handle the bot review (CodeRabbit)
  expected_duration: 30m
  inputs: null
  outputs: null
  cache: null
  success_check: scripts/check-pr.sh
  type: agent_task
  prompt: |-
    Standing brief: {{params.brief}}
    Commit trailer: {{params.commit_trailer}}
    PR: read the number from <git-dir>/osb-pr-prepare/pr.env.

    This node starts IMMEDIATELY after the push, while CI is still running.
    Do not wait for the checks to conclude and do not watch them; the
    ci_wait node after you waits for the checks. Start the review work now.

    First wait for CodeRabbit's review to be POSTED: it usually arrives
    minutes after the push, long before the checks end. Poll
    `gh api repos/<owner>/<repo>/pulls/<n>/reviews` and
    `.../pulls/<n>/comments` in one blocking loop (sleep 60 between calls,
    at most 10 minutes), then read what it said: `gh pr view <n>
    --comments`. If no CodeRabbit review appears in that window, say so in
    the reply and continue. Handle only comments you have not already
    answered in an earlier pass of this node.

    The operator may hand external review documents to the orchestrator
    mid-wave (paths under .reviews/ or pasted text). When this task's
    response carries them, treat every finding in them exactly like a
    CodeRabbit finding: verify against the current code, then fix or
    answer. Such findings are worked on immediately, never held back for
    CI.

    - Skipped (for example "files exceed the limit"): post one PR
      comment saying which internal review compensated (the
      dev quality cycle of this run: OpenCodeReview, Codex review,
      /security-review, security-audit and test-audit), in neutral terms.
    - Each finding: verify it against the current code with the
      receiving-code-review discipline. Valid: fix with the smallest
      diff. Not valid or no longer applicable: reply on the thread with
      a one-sentence technical reason. Valid fixes get a reply naming
      the commit.
    - Fixes go through the convergence table of the dev-quality-cycle
      skill (references/convergence.md, section 5): usually OCR on the
      fix commits only (`<skill>/scripts/cycle.sh --range
      <before-fix>..HEAD --steps ocr`), never a full cycle restart by
      itself. Push only when that is clean.
    - Commit fixes per the brief (for example `fix: address CodeRabbit
      review feedback`) and push the same way push_pr did. A push here
      restarts CI; that is expected, because the ci_wait node after you
      waits for the new run.
    One pass per call; do not wait for a second bot pass.

    Write your verdict to $APB_STATUS_FILE with outputs
    {pushed: "yes" if you pushed commits, else "no", findings: <count>,
    fixed: [shas], answered: <count>, skipped_reason: <text or "">}.
  profile: null
  max_retries: 1
  timeout_seconds: null
  workdir: null
  isolation: null
  connectors: []
  interactive: false
