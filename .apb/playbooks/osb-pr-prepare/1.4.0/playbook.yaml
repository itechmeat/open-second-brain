    findings, fixed, declined; security only "clean" or the count of
    fixed items and advisory drafts, never details; rounds and the
    convergence decision), the architecture gate and the final gates did; and a "Left for a human" list: gates that ended on their
    loop budget, known environment-only test failures, bot findings
    answered but not fixed, cycle findings declined or deferred, advisory drafts to publish, the merge
    itself. Plain text, English.
  profile: null
